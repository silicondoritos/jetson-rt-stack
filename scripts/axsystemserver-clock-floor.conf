# Floor the system clock right before the Axelera runtime brings up the Metis NPU,
# so a battery-less-carrier 1970 clock can never reach device bring-up (which would
# fail ZIP<1980 / cert checks -> axl IRQ MSI timeout). Belt-and-suspenders alongside
# CONFIG_RTC_HCTOSYS_DEVICE=rtc1. See docs/TROUBLESHOOTING.md H-13.
[Service]
ExecStartPre=/usr/local/sbin/jetson_clock_floor.sh apply
